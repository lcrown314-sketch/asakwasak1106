<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Engineer Portfolio</title>
  <style>
    :root {
      --bg: #0f1115;
      --fg: #e8eaf0;
      --muted: #9aa0ad;
      --accent: #7c9cff;
      --border: #23262f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }
    main { max-width: 640px; width: 100%; }
    h1 { font-size: 2.25rem; font-weight: 600; letter-spacing: -0.02em; }
    .tag { color: var(--accent); font-size: 1rem; margin-top: 4px; }
    .bio { color: var(--muted); margin: 24px 0; }
    h2 { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 32px 0 12px; }
    ul { list-style: none; }
    li { padding: 6px 0; border-bottom: 1px solid var(--border); }
    li:last-child { border-bottom: none; }
    .links { display: flex; gap: 16px; margin-top: 32px; }
    a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--border); padding-bottom: 2px; }
    a:hover { color: var(--accent); border-color: var(--accent); }
    footer { margin-top: 48px; color: var(--muted); font-size: 0.8125rem; }
  </style>
</head>
<body>
  <main>
    <h1>AI Engineer</h1>
    <p class="tag">Python · Machine Learning · Finance AI</p>
    <p class="bio">Python과 AI 엔지니어링을 학습하고 있습니다. 금융과 AI 기술을 결합한 서비스를 직접 개발하는 것이 목표입니다.</p>

    <h2>Interests</h2>
    <ul>
      <li>Python 및 데이터 분석</li>
      <li>머신러닝과 딥러닝</li>
      <li>금융 AI 서비스 개발</li>
    </ul>

    <h2>Links</h2>
    <div class="links">
      <a href="https://github.com/lcrown314-sketch" target="_blank" rel="noopener">GitHub</a>
    </div>

    <footer>© 2026</footer>
  </main>
</body>
</html>
